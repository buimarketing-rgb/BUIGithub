# BUI – Business Unified Intelligence
# Free, self-hosted stack:  docker compose up -d --build   ->  http://localhost
name: bui

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bui}:${POSTGRES_PASSWORD:-bui}@db:5432/${POSTGRES_DB:-bui}
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: http://ollama:11434
  SEARXNG_URL: http://searxng:8080
  FRONTEND_ORIGIN: ${PUBLIC_URL:-http://localhost}
  CORS_ORIGINS: '["${PUBLIC_URL:-http://localhost}"]'

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bui}
      POSTGRES_DB: ${POSTGRES_DB:-bui}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bui} -d ${POSTGRES_DB:-bui}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    # NVIDIA GPU (optional): uncomment
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "http://ollama:11434" }
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
      GRANIAN_HOST: 0.0.0.0   # bind IPv4 (works on Docker hosts without IPv6)
    volumes: ["./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro"]

  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-true}
        INSTALL_WHISPER: ${WHISPER_ENABLED:-false}
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  frontend:
    build: { context: ./frontend, args: { BACKEND_URL: "http://backend:8000" } }
    restart: unless-stopped
    depends_on: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    volumes: ["./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, backend]

volumes:
  pgdata:
  uploads:
  ollama:
